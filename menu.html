<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>いろいろSAMPLE - 色一覧</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f9f9f9; color: #2f4f4f; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; }
        .nav-buttons { display: flex; justify-content: space-between; margin: 20px 0; }
        .btn { padding: 8px 16px; background: #eee; text-decoration: none; color: #333; border-radius: 4px; font-size: 0.9em; }
        .btn:hover { background: #ddd; }
        .color-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin: 20px 0; }
        .color-item { display: flex; align-items: center; text-decoration: none; color: #333; border: 1px solid #eee; border-radius: 6px; overflow: hidden; }
        .color-preview { width: 50px; height: 50px; flex-shrink: 0; }
        .color-name { padding: 0 10px; font-size: 0.95em; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1><a href="index.html" style="color:#d71d3b; text-decoration:none;">いろいろSAMPLE</a></h1>
    <h2 id="page-title">◆ 読み込み中 ◆</h2>

    <div class="nav-buttons">
        <a class="btn" id="btn-back" href="#">&laquo; 前の色系</a>
        <a class="btn" id="btn-next" href="#">次の色系 &raquo;</a>
    </div>

    <div class="color-grid" id="color-grid"></div>

    <div class="nav-buttons">
        <a class="btn" id="btn-back2" href="#">&laquo; 前の色系</a>
        <a class="btn" href="index.html">TOPメニュー</a>
        <a class="btn" id="btn-next2" href="#">次の色系 &raquo;</a>
    </div>

    <footer style="margin-top:30px; font-size:0.85em; color:#888;">&copy; iroirosample.net</footer>
</div>

<script>
    const categories = {
        'red':    { name: '赤系', next: 'orange', back: 'mono' },
        'orange': { name: 'オレンジ系', next: 'brown', back: 'red' },
        'brown':  { name: '茶系', next: 'yellow', back: 'orange' },
        'yellow': { name: '黄系', next: 'green', back: 'brown' },
        'green':  { name: '緑系', next: 'blue', back: 'yellow' },
        'blue':   { name: '青系', next: 'purple', back: 'green' },
        'purple': { name: '紫系', next: 'pink', back: 'blue' },
        'pink':   { name: 'ピンク系', next: 'mono', back: 'purple' },
        'mono':   { name: '白黒系', next: 'red', back: 'pink' }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const cid = urlParams.get('cid') || 'red';
    const currentCat = categories[cid] || categories['red'];

    document.getElementById('page-title').textContent = `◆ ${currentCat.name} ◆`;
    document.title = `いろいろSAMPLE ◆${currentCat.name}◆`;

    // ナビゲーションボタンの設定
    ['btn-back', 'btn-back2'].forEach(id => {
        const el = document.getElementById(id);
        el.href = `menu.html?cid=${currentCat.back}`;
        el.textContent = `« 前の色系 (${categories[currentCat.back].name})`;
    });
    ['btn-next', 'btn-next2'].forEach(id => {
        const el = document.getElementById(id);
        el.href = `menu.html?cid=${currentCat.next}`;
        el.textContent = `次の色系 (${categories[currentCat.next].name}) »`;
    });

    // CSV読み込み
    fetch('iro.csv')
        .then(res => res.text())
        .then(text => {
            const grid = document.getElementById('color-grid');
            const lines = text.split('\n');
            lines.forEach(line => {
                const cols = line.split(',');
                if (cols[0] === cid) {
                    const id = cols[1];
                    const name = cols[2];
                    const code = cols[4];
                    grid.innerHTML += `
                        <a class="color-item" href="sample.html?cid=${id}">
                            <div class="color-preview" style="background-color: #${code};"></div>
                            <div class="color-name">${name}</div>
                        </a>
                    `;
                }
            });
        });
</script>

</body>
</html>
