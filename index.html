<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>いろ色SAMPLE ～色見本・カラーサンプル～</title>
    <meta name="description" content="JIS規格に基づくシンプルな色見本・カラーサンプルサイトです。">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 20px; color: #2f4f4f; background-color: #f9f9f9; text-align: center;
        }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #d71d3b; margin-bottom: 20px; }
        .grid-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin: 30px 0; }
        .card { display: flex; align-items: center; text-decoration: none; color: #333; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); }
        .color-box { width: 60px; height: 60px; flex-shrink: 0; }
        .card-label { padding: 0 15px; font-weight: bold; font-size: 1.1em; }
        footer { margin-top: 40px; font-size: 0.85em; color: #777; }
        a.link { color: #0091c5; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>いろいろ SAMPLE</h1>
    <p>シンプルで使いやすいカラーサンプル・色見本集</p>
    
    <div class="grid-menu" id="menu-container"></div>

    <footer>
        <p><a href="mailto:iroirosample@hotmail.co.jp" class="link">管理人にメール</a></p>
        <p>&copy; iroirosample.net</p>
    </footer>
</div>

<script>
    const categories = [
        { id: 'red', name: '赤系', color: '#d71d3b' },
        { id: 'orange', name: 'オレンジ系', color: '#e67928' },
        { id: 'brown', name: '茶系', color: '#734229' },
        { id: 'yellow', name: '黄系', color: '#fbd01d' },
        { id: 'green', name: '緑系', color: '#3baf75' },
        { id: 'blue', name: '青系', color: '#0091c5' },
        { id: 'purple', name: '紫系', color: '#7c4b8d' },
        { id: 'pink', name: 'ピンク系', color: '#eda49e' },
        { id: 'mono', name: '白・黒系', color: '#6b6d6c' }
    ];

    const container = document.getElementById('menu-container');
    categories.forEach(cat => {
        container.innerHTML += `
            <a href="menu.html?cid=${cat.id}" class="card">
                <div class="color-box" style="background-color: ${cat.color};"></div>
                <div class="card-label">${cat.name}</div>
            </a>
        `;
    });
</script>

</body>
</html>
