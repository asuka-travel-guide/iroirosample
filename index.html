<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>いろ色SAMPLE</title>
    <!-- 分離したCSSファイルを読み込み -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ヘッダーエリア -->
    <header>
        <!-- サイト名（CSSでHIDDEN化設定済み） -->
        <h1 class="site-title">いろ色SAMPLE</h1>

        <!-- ヘッダーメニュー（横幅統一・シャープな角丸・マークアップ用） -->
        <nav>
            <button type="button" class="active">赤系</button>
            <button type="button">茶系</button>
            <button type="button">黄系</button>
            <button type="button">緑系</button>
            <button type="button">青系</button>
            <button type="button">紫系</button>
            <button type="button">ピンク系</button>
            <button type="button">白黒系</button>
        </nav>
    </header>

    <!-- メインコンテンツ -->
    <main>
        <!-- 1. 一覧画面（◆ 赤系 ◆ などの見出しはCSSでHIDDEN化設定済み） -->
        <div id="list-view" class="grid-container">
            <!-- JavaScriptでカード（背景色・文字色・コード入り）が動的生成されます -->
        </div>

        <!-- 2. 各色サンプル画面（詳細表示） -->
        <!-- 初期状態は非表示（display: none）。選択時にJavaScriptで背景色がその色になります -->
        <div id="detail-view" style="display: none;">
            <!-- JavaScriptで「<」「色情報」「>」のみが生成されます -->
        </div>
    </main>

    <!-- 分離したJavaScriptファイルを読み込み -->
    <script src="script.js"></script>
</body>
</html>
