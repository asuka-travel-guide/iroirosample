<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カラーサンプル</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 class="site-title">カラーサンプル</h1>

        <div class="nav-container">
            <!-- 【修正】一重矢印（<） -->
            <button type="button" class="nav-arrow-btn" id="hdr-prev-btn" aria-label="前へ">&lt;</button>
            
            <!-- 【修正】テキストを nav-btn-text クラスで囲みCSSでhidden化 -->
            <nav id="category-nav">
                <button type="button" class="nav-btn active" data-category="赤系" style="background-color: #d7003a; color: #fff;"><span class="nav-btn-text">赤系</span></button>
                <button type="button" class="nav-btn" data-category="橙系" style="background-color: #eb6100; color: #fff;"><span class="nav-btn-text">橙系</span></button>
                <button type="button" class="nav-btn" data-category="茶系" style="background-color: #6e4a27; color: #fff;"><span class="nav-btn-text">茶系</span></button>
                <button type="button" class="nav-btn" data-category="黄系" style="background-color: #fcc800; color: #333;"><span class="nav-btn-text">黄系</span></button>
                <button type="button" class="nav-btn" data-category="緑系" style="background-color: #009854; color: #fff;"><span class="nav-btn-text">緑系</span></button>
                <button type="button" class="nav-btn" data-category="青系" style="background-color: #007bbb; color: #fff;"><span class="nav-btn-text">青系</span></button>
                <button type="button" class="nav-btn" data-category="紫系" style="background-color: #674196; color: #fff;"><span class="nav-btn-text">紫系</span></button>
                <button type="button" class="nav-btn" data-category="桃系" style="background-color: #f596aa; color: #fff;"><span class="nav-btn-text">桃系</span></button>
                <button type="button" class="nav-btn" data-category="白黒" style="background-color: #595857; color: #fff;"><span class="nav-btn-text">白黒</span></button>
            </nav>

            <!-- 【修正】一重矢印（>） -->
            <button type="button" class="nav-arrow-btn" id="hdr-next-btn" aria-label="次へ">&gt;</button>
        </div>
    </header>

    <main>
        <div id="list-view" class="grid-container"></div>
        <div id="detail-view" style="display: none;"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
