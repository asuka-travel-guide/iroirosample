<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>色見本</title>
    <style>
        body {
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: sans-serif; text-align: center;
        }
        a { text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        h1 { font-size: 2.5em; margin: 10px 0 5px 0; }
        h2 { font-size: 1.3em; margin: 0 0 30px 0; opacity: 0.8; }
        .nav-container { display: flex; flex-direction: column; gap: 15px; width: 280px; }
        .row { display: flex; justify-content: space-between; }
        .btn-link { padding: 10px; border-style: solid; border-width: 1px; border-radius: 6px; font-size: 0.9em; }
    </style>
</head>
<body>

    <h1 id="color-name">...</h1>
    <h2 id="color-code">...</h2>

    <div class="nav-container">
        <div><a class="btn-link" id="btn-prev" style="display:block;" href="#">&uarr; 前の色</a></div>
        <div class="row">
            <a class="btn-link" id="btn-pback" href="#">&larr; 前の色系</a>
            <a class="btn-link" id="btn-pnext" href="#">次の色系 &rarr;</a>
        </div>
        <div><a class="btn-link" id="btn-next" style="display:block;" href="#">&darr; 次の色</a></div>
        <div style="margin-top: 15px;">
            <a class="btn-link" id="btn-list" style="display:block;" href="#">一覧へ戻る</a>
        </div>
    </div>

    <footer style="margin-top: 40px; font-size: 0.8em; opacity: 0.8;">&copy; iroirosample.net</footer>

<script>
    const systemNav = {
        'red':    { next: "41",  back: "242" },
        'orange': { next: "55",  back: "1" },
        'brown':  { next: "91",  back: "41" },
        'yellow': { next: "121", back: "55" },
        'green':  { next: "163", back: "91" },
        'blue':   { next: "207", back: "121" },
        'purple': { next: "230", back: "163" },
        'pink':   { next: "242", back: "207" },
        'mono':   { next: "1",   back: "230" }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const targetId = urlParams.get('cid') || '1';

    fetch('iro.csv')
        .then(res => res.text())
        .then(text => {
            const lines = text.split('\n');
            let item = null;

            for (let line of lines) {
                const cols = line.split(',');
                if (cols[1] === targetId) {
                    item = cols;
                    break;
                }
            }

            // デフォルト（見つからない場合）
            if (!item) item = ['red', '1', '赤色', 'あかいろ', 'ff0000', '200'];

            const cat = item[0];
            const currentId = parseInt(item[1], 10);
            const name = item[2];
            const kana = item[3];
            const hex = item[4];
            const lum = parseInt(item[5] || '0', 10);

            // 文字色決定
            const textColor = lum < 400 ? '#f5f5f5' : '#2f4f4f';

            // スタイル適用
            document.body.style.backgroundColor = `#${hex}`;
            document.body.style.color = textColor;
            document.querySelectorAll('a').forEach(a => a.style.color = textColor);
            document.querySelectorAll('.btn-link').forEach(btn => btn.style.borderColor = textColor);

            // テキスト適用
            document.getElementById('color-name').textContent = name;
            document.getElementById('color-code').textContent = `${kana} ( #${hex} )`;
            document.title = `${name} - 色見本`;

            // リンク設定
            const prevId = currentId > 1 ? currentId - 1 : 269;
            const nextId = currentId < 269 ? currentId + 1 : 1;
            const pnext = systemNav[cat] ? systemNav[cat].next : '1';
            const pback = systemNav[cat] ? systemNav[cat].back : '1';

            document.getElementById('btn-prev').href = `sample.html?cid=${prevId}`;
            document.getElementById('btn-next').href = `sample.html?cid=${nextId}`;
            document.getElementById('btn-pback').href = `sample.html?cid=${pback}`;
            document.getElementById('btn-pnext').href = `sample.html?cid=${pnext}`;
            document.getElementById('btn-list').href = `menu.html?cid=${cat}`;
        });
</script>

</body>
</html>
